name: StepBuddy iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel an in-progress run when a newer commit is pushed to the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    env:
      # Keep in sync with the local Homebrew version (`swiftlint version`)
      SWIFTLINT_VERSION: 0.65.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      # Violations show up as annotations on the PR diff. Only errors fail the
      # job (no --strict), matching the Xcode build.
      - name: Lint
        run: swiftlint lint --quiet --reporter github-actions-logging

  build:
    name: Build
    # Pinned instead of macos-latest so the image only changes when we choose to
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image's default Xcode lags behind new releases. Use the newest stable
      # Xcode installed (betas and RCs are skipped), so CI moves to Xcode 27 as
      # soon as GitHub adds it to the image.
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app \
            | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' \
            | sort -V \
            | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # A build doesn't need a booted simulator, so build for the generic
      # destination (same command as CLAUDE.md) instead of picking a device
      - name: Build
        run: |
          xcodebuild build \
            -project stepbuddy.xcodeproj \
            -scheme stepbuddy \
            -destination 'generic/platform=iOS Simulator'
