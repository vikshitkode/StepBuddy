name: StepBuddy iOS CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel an in-progress run when a newer commit is pushed to the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-26
    env:
      # The only SwiftLint that checks this repo (no Xcode build phase), so bump it here
      SWIFTLINT_VERSION: 0.65.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" swiftlint -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      # Violations show up as annotations on the PR diff. Only errors fail the
      # job (no --strict).
      - name: Lint
        run: swiftlint lint --quiet --reporter github-actions-logging

  build:
    name: Build
    # Pinned instead of macos-latest so the image only changes when we choose to
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image's default Xcode lags behind new releases. Use the newest stable
      # Xcode installed (betas and RCs are skipped), so CI moves to Xcode 27 as
      # soon as GitHub adds it to the image.
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app \
            | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' \
            | sort -V \
            | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # Tests need a real simulator. Pick an iPhone from the newest iOS runtime on
      # the image rather than hardcoding a name that changes with every Xcode.
      # `xcodebuild test` builds the app too, so there's no separate build step.
      - name: Build and test
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[] | select(.key | test("SimRuntime.iOS-"))
             | .key as $runtime | .value[] | select(.name | startswith("iPhone"))
             | {udid, version: ($runtime | capture("iOS-(?<v>[0-9-]+)").v | split("-") | map(tonumber))}]
            | sort_by(.version) | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = null ]; then
            echo "::error::No iPhone simulator found on this runner"
            exit 1
          fi
          xcrun simctl list devices | grep "$UDID"
          xcodebuild test \
            -project stepbuddy.xcodeproj \
            -scheme stepbuddy \
            -destination "id=$UDID"
